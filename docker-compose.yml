
services:
  mysql:
    image: mysql:8.0
    container_name: workway_mysql
    restart: always
    env_file: .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: workway_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  mysql_data: